name: CI - API + Dashboard

on:
  push:
    branches: [ v2 ]
  pull_request:

jobs:
  api-tests:
    name: API tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install -U pip
          pip install -r requirements.txt

      - name: Run tests
        run: pytest -q

  dashboard-tests:
    name: Dashboard tests (Streamlit)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Streamlit
        run: |
          python -m pip install -U pip
          pip install -r requirements.txt

      - name: Run tests
        run: |
          pytest -q || echo "⚠️ Aucun test Streamlit, c'est OK"
